name: Restore Site100 source

on:
  push:
    branches: [site100-100worlds]
    paths:
      - '.github/workflows/restore-site100.yml'
      - '.bootstrap/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/restore-site100.yml'
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-site100-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified source archive
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" -eq 4
          python <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.bootstrap/part-01')
          payload = bytearray(path.read_bytes())
          fixed_segment = bytearray(Path('.bootstrap/fix-segment-04').read_bytes())
          repair = bytes.fromhex('464430685a446e32464543527a4176326a6464477a6735506f7462633348714761674c44463948414d59574a6c576a67634263587573457341797a42704d367a476b6a67596457544e716c34704c6b74694172726b4b56446458704437323574722f7159')

          if len(payload) != 18000 or len(fixed_segment) != 1000 or len(repair) != 100:
              raise SystemExit('Unexpected archive segment length')

          fixed_segment[400:500] = repair
          expected_segment = '3e14bf07974f6d15dd231135005b2f518e45a4a6f562836bd6820d7069ba8306'
          if sha256(fixed_segment).hexdigest() != expected_segment:
              raise SystemExit('Corrected 1KB segment checksum mismatch')

          payload[4000:5000] = fixed_segment
          path.write_bytes(payload)
          PY
          echo 'cc5b4dc5fad7e56a8586c4e0cc5fda6afe858cd4a6533737a2bcee66f1bbe681  .bootstrap/part-01' | sha256sum -c -
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 | tr -d '\r\n ' | base64 --decode > /tmp/site100-source.tar.gz
          echo 'ec24645d56070db7c65199f7e18a323652c2d9b250ff669a57af7ab8ceb4d10c  /tmp/site100-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/site100-source.tar.gz -C .
          test -s package.json
          test -s src/catalog.js
          test -s src/app.js
          test -s src/styles.css
          test -s scripts/check.mjs
          test -s scripts/build.mjs

      - name: Validate 100 designs and build
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -s dist/index.html
          test -s dist/assets/catalog.js
          test -s dist/assets/app.js
          test -s dist/assets/styles.css
          route_count="$(find dist/sites -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          test "$route_count" -eq 100
          test -s dist/sites/salt-bakery/index.html
          test -s dist/sites/endpoint-api/index.html
          test -s dist/sites/dal-hanok-stay/index.html
          test -s dist/sites/100worlds-gallery/index.html
          echo "Validated $route_count independent website routes."

      - name: Commit restored source
        run: |
          rm -rf dist .bootstrap
          rm -f .github/workflows/restore-site100.yml
          rm -f .github/workflows/site100-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add 100 distinct industry websites'
          git push origin HEAD:site100-100worlds
